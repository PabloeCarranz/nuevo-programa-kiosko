<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caja</title>
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee en claro
      // al cargar. Misma logica que store/temaStore.ts.
      try {
        var t = localStorage.getItem('pos-tema')
        if (t === 'sistema') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        if (t) document.documentElement.dataset.theme = t
        document.documentElement.dataset.size = localStorage.getItem('pos-tamanio') || 'grande'
      } catch (e) {
        document.documentElement.dataset.size = 'grande'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
